server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: testserver
  
  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/basesys?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&useAffectedRows=true
    username: root
    password: root
    
    # Druid连接池配置
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.product.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置（排查今日头条无文案时，保持 com.product: debug 可看到 Coze body keys / final_result platforms）
logging:
  level:
    root: info
    com.product: debug
    org.springframework.web: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# 自定义配置
app:
  # 文件上传路径
  upload-path: upload
  # 静态资源路径
  static-path: /static/
  # 默认密码
  default-password: root

jwt:
  secret: your-strong-secret-key-here-change-in-production
  expiration: 86400000   # 24小时，单位毫秒

# Coze 云端工作流
# 鉴权：必须设置环境变量 COZE_WORKLOAD_IDENTITY_API_KEY（Coze 工作台 API Token），否则返回 401
# 排查：见 doc/coze-debug-checklist.md（工作流配置、DEBUG 日志、API Key、执行状态）
coze:
  workflow:
    base-url: https://j7v23xgtbm.coze.site
    endpoint-path: /stream_run
    timeout-seconds: 300